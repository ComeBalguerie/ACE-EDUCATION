<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e6df;color:#1d1c1a;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}a:hover{color:oklch(0.45 0.13 250)}
@page{size:A4;margin:0}
@media print{body{background:#fff}[data-noprint]{display:none !important}[data-page]{margin:0 !important;box-shadow:none !important;break-after:page}}
</style>
<script src="./cloud.js"></script>
</helmet>
<div data-noprint="1" style="max-width:210mm;margin:0 auto;padding:32px 0 8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">
  <div style="display:flex;flex-direction:column;gap:2px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6b675e">{{ kitKicker }}</span>
    <span style="font-family:Newsreader,serif;font-size:26px">{{ kitTitle }}</span>
  </div>
  <div style="display:flex;gap:10px;align-items:center"><a data-noprint="1" href="{{ backHref }}" title="Retour" style="display:flex;align-items:center;gap:6px;padding:7px 12px;background:#1d1c1a;color:#f3f0e8;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none" style-hover="background:#4a4740;color:#f3f0e8">{{ backLabel }}</a><button onClick="{{ print }}" style="font:500 13px 'IBM Plex Sans',sans-serif;background:#1d1c1a;color:#f5f3ee;border:0;border-radius:999px;padding:10px 18px;cursor:pointer">Imprimer / PDF</button></div>
</div>
<sc-for list="{{ pages }}" as="pg" hint-placeholder-count="2">
  <section data-page="1" id="{{ pg.anchor }}" data-screen-label="{{ pg.label }}" style="width:210mm;height:297mm;box-sizing:border-box;padding:14mm 15mm;margin:16px auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <div style="display:flex;justify-content:space-between;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#4a4740;border-bottom:1.5px solid #1d1c1a;padding-bottom:6px">
      <span>{{ pg.kicker }}</span><span>{{ pg.kind }}</span>
    </div>
    <h1 style="font-family:Newsreader,serif;font-weight:400;font-size:30px;line-height:1.05;margin:4px 0 0;text-wrap:balance">{{ pg.title }}</h1>
    <sc-if value="{{ pg.hasIntro }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:12.5px;line-height:1.6;color:#2a2926;text-wrap:pretty;white-space:pre-line">{{ pg.intro }}</p></sc-if>
    <sc-if value="{{ pg.hasFields }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:8px 18px">
        <sc-for list="{{ pg.fields }}" as="f"><div style="flex:1 1 40mm;display:flex;gap:6px;align-items:flex-end;font-size:11px"><span style="font-weight:600">{{ f }}</span><span style="flex:1;border-bottom:1px solid #8a857a;height:14px"></span></div></sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.isFiche }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 20px">
        <sc-for list="{{ pg.blocks }}" as="b">
          <div style="display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid #d9d4c7">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.42 0.1 250)">{{ b.h }}</div>
            <sc-for list="{{ b.items }}" as="it"><div style="font-size:11px;line-height:1.45;text-wrap:pretty">{{ it }}</div></sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.isTable }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;border:1px solid #1d1c1a;flex:1;min-height:0">
        <div style="display:grid;grid-template-columns:{{ pg.cols }};background:#1d1c1a;color:#fff">
          <sc-for list="{{ pg.head }}" as="hd"><div style="padding:5px 6px;font-size:9.5px;font-weight:600;letter-spacing:.04em;border-right:1px solid #4a4740">{{ hd }}</div></sc-for>
        </div>
        <sc-for list="{{ pg.rows }}" as="r">
          <div style="display:grid;grid-template-columns:{{ pg.cols }};border-top:1px solid #b9b2a2;flex:1;min-height:{{ pg.rowH }}">
            <sc-for list="{{ r.cells }}" as="c"><div style="padding:5px 6px;font-size:10px;line-height:1.35;border-right:1px solid #d9d4c7;font-weight:{{ c.w }};color:#2a2926">{{ c.t }}</div></sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.hasNote }}" hint-placeholder-val="{{ false }}"><div style="font-size:10.5px;line-height:1.45;color:#4a4740;padding-top:6px;border-top:1px solid #d9d4c7">{{ pg.note }}</div></sc-if>
    <div style="margin-top:auto;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:#8a857a">Cliclac Studio · {{ pg.foot }}</div>
  </section>
</sc-for>
</x-dc>
<script type="text/x-dc" data-dc-script>
/*KIT*/
const KIT = {title:'Image de marque — B2 EIDM', pages:[
 {kicker:'Image de marque · Séance 1', kind:'Fiche récap', title:'Identité et image de marque', blocks:[
  {h:'Identité', items:['Ce que la marque émet : valeurs, histoire, discours, codes.','Décidée par la marque.']},
  {h:'Image', items:['Ce que le public perçoit et retient.','Construite par l’ensemble des points de contact.']},
  {h:'Prisme de Kapferer — côté marque', items:['Physique : produits, logo, couleurs, matières.','Personnalité : le caractère prêté à la marque.','Culture : valeurs, origine, histoire.']},
  {h:'Prisme de Kapferer — côté client', items:['Relation : le lien proposé.','Reflet : l’image du client type.','Mentalisation : ce que le client pense de lui-même.']},
  {h:'Signes visibles', items:['Univers visuel : logo, couleurs, typo, photo.','Ton : registre, humour ou gravité.','Codes esthétiques : pièces, motifs, matières.','Codes sensoriels : musique, parfum, lumière.']},
  {h:'Points de contact', items:['Produit, prix, boutique, vitrine, vendeur, packaging, site, réseaux, campagnes, presse, bouche-à-oreille.']}]},
 {kicker:'Image de marque · Séance 1', kind:'Grille d’analyse', title:'Décoder une marque', fields:['Binôme','Marque analysée','Segment supposé'], cols:'38mm 1fr', head:['Critère','Observations (avec preuves visuelles)'], rowH:'20mm', rows:[['Univers visuel'],['Ton'],['Codes esthétiques'],['Codes sensoriels supposés'],['Physique · Personnalité · Culture'],['Relation · Reflet · Mentalisation'],['Segment et justification']]},
 {kicker:'Image de marque · Séance 1', kind:'Tirage au sort', title:'Liste des marques', intro:'Chaque binôme tire une marque. Au moins une marque par segment doit être auditée.', cols:'30mm 1fr 1fr', head:['Segment','Marques','Binôme'], rowH:'40mm', rows:[['Mass','Zara · Uniqlo · H&M · Mango'],['Premium','COS · Sandro · Sézane · A.P.C. · Jacquemus'],['Luxe','Hermès · Celine · Loewe · Chanel · Dior']]},
 {kicker:'Image de marque · Séance 2', kind:'Fiche récap', title:'L’offre produit', blocks:[
  {h:'Pièces image', items:['Défilé, campagne.','Peu vendues, elles fixent l’image.']},
  {h:'Cœur de gamme', items:['L’essentiel du chiffre d’affaires.']},
  {h:'Produits d’accès', items:['Accessoires, petite maroquinerie, parfum, beauté.','Font entrer de nouveaux clients.']},
  {h:'Basiques, carry-over, capsules', items:['Pièces reconduites de saison en saison.','Offres limitées pour créer l’événement.']},
  {h:'Ce que l’offre dit', items:['Largeur et profondeur de gamme.','Prix et écarts de prix.','Matières, fabrication.','Rythme de renouvellement.']},
  {h:'Cas', items:['Yves Saint Laurent Rive Gauche, 1966.','Jacquemus, Le Chiquito.','Hermès, Birkin et produits d’accès.']}]},
 {kicker:'Image de marque · Séance 2', kind:'Relevé', title:'Relevé de l’offre produit', fields:['Binôme','Marque','Date du relevé'], cols:'8mm 1fr 20mm 30mm 26mm 30mm', head:['#','Produit','Prix','Matière','Couleur','Niveau'], rowH:'6.8mm', rows:Array.from({length:30},(_, i)=>[String(i+1)]), note:'Niveau : I = pièce image · C = cœur de gamme · A = produit d’accès · B = basique.'},
 {kicker:'Image de marque · Entre S2 et S3', kind:'Visite terrain', title:'Grille de visite du point de vente', fields:['Binôme','Boutique visitée (adresse)','Date et heure'], cols:'40mm 1fr', head:['À relever','Observations'], rowH:'17mm', rows:[['Vitrine (type, point focal, produits)'],['Entrée et zone de décompression'],['Parcours (dessiner au dos)'],['Mobilier, matériaux, couleurs'],['Lumière, musique, odeur'],['Personnel (tenue, accueil)'],['Produits mis en avant'],['Trois mots pour résumer']], note:'Photos : vitrine, entrée, trois zones, caisse. Demander l’autorisation au personnel.'},
 {kicker:'Image de marque · Séance 3', kind:'Grille d’analyse', title:'Analyse comparative de vitrines', fields:['Binôme'], cols:'34mm 1fr 1fr 1fr 1fr', head:['Critère','Vitrine 1','Vitrine 2','Vitrine 3','Notre vitrine'], rowH:'22mm', rows:[['Type (fermée, ouverte, thème)'],['Point focal'],['Produits montrés'],['Décor et matériaux'],['Lumière'],['Message principal'],['Segment']]},
 {kicker:'Image de marque · Séance 3', kind:'Consignes', title:'Dossier d’audit et oral', blocks:[
  {h:'Format', items:['10 à 12 pages, PDF, en binôme.','Nommage : BINOME_Marque_Final.pdf']},
  {h:'Structure', items:['1. Identité déclarée.','2. Offre produit.','3. Point de vente.','4. Écarts et cohérences.','5. Recommandation.']},
  {h:'Preuves', items:['Chaque affirmation appuyée par une photo, une capture ou un relevé.','Sources citées.']},
  {h:'Oral', items:['8 minutes + 4 minutes de questions.','Les deux membres parlent.','Analyser, ne pas décrire.']},
  {h:'Évaluation', items:['Grilles S1 à S3 : 40 %.','Dossier : 35 %.','Oral : 25 %.']},
  {h:'À éviter', items:['Recopier le discours de la marque.','Juger sans preuve.','Oublier la recommandation.']}]},
 {kicker:'Image de marque · Séance 4', kind:'Grille de synthèse', title:'Mass, premium, luxe', cols:'30mm 1fr 1fr 1fr 1fr 1fr', head:['Critère','Marque 1','Marque 2','Marque 3','Marque 4','Marque 5'], rowH:'20mm', rows:[['Segment'],['Prix'],['Rareté'],['Distribution'],['Service'],['Communication'],['Rapport au temps'],['Écart principal']]},
 {kicker:'Image de marque · Séance 4', kind:'Évaluation', title:'Grille d’évaluation des oraux', fields:['Binôme','Marque'], cols:'1fr 14mm 14mm 14mm 14mm 14mm 50mm', head:['Critère','0','1','2','3','4','Commentaire'], rowH:'18mm', rows:[['Identité déclarée clairement résumée'],['Analyse de l’offre produit'],['Analyse du point de vente'],['Écarts relevés et prouvés'],['Recommandation pertinente'],['Clarté et temps respecté'],['Réponses aux questions']], note:'Total sur 28, ramené sur 20.'}
]};
/*END*/
class Component extends DCLogic {
  componentDidMount() { const h = location.hash.slice(1); if (h) setTimeout(() => { const el = document.getElementById(h); if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 16); }, 300); }
  renderVals() {
    const EL = /[?&]eleves\b/.test(location.search);
    const pages = KIT.pages.filter(p => !EL || p.kind === 'Fiche récap').map((p, i) => {
      const n = p.head ? p.head.length : 0;
      return {
        anchor: 'p' + (i + 1), label: String(i + 1).padStart(2, '0') + ' ' + p.title, kicker: p.kicker, kind: p.kind, title: p.title,
        hasIntro: !!p.intro, intro: p.intro || '', hasFields: !!p.fields, fields: p.fields || [],
        isFiche: !!p.blocks, blocks: p.blocks || [],
        isTable: !!p.head, head: p.head || [], cols: p.cols || '1fr', rowH: p.rowH || '10mm',
        rows: (p.rows || []).map(r => ({ cells: Array.from({ length: n }, (_, j) => ({ t: r[j] || '', w: j === 0 ? 600 : 400 })) })),
        hasNote: !!p.note, note: p.note || '', foot: KIT.title
      };
    });
    return { pages, kitTitle: KIT.title, kitKicker: EL ? 'Fiches de révision' : 'Kit de séance · documents à imprimer', backHref: EL ? 'Espace etudiant.dc.html' : 'Sommaire.dc.html', backLabel: EL ? '← Espace étudiant' : '← Sommaire', print: () => window.print() };
  }
}
</script>
</body>
</html>
