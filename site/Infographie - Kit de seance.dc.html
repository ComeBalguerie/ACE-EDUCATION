<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e6df;color:#1d1c1a;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}a:hover{color:oklch(0.45 0.13 250)}
@page{size:A4;margin:0}
@media print{body{background:#fff}[data-noprint]{display:none !important}[data-page]{margin:0 !important;box-shadow:none !important;break-after:page}}
</style>
</helmet>
<div data-noprint="1" style="max-width:210mm;margin:0 auto;padding:32px 0 8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">
  <div style="display:flex;flex-direction:column;gap:2px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6b675e">Kit de séance · documents à imprimer</span>
    <span style="font-family:Newsreader,serif;font-size:26px">{{ kitTitle }}</span>
  </div>
  <div style="display:flex;gap:10px;align-items:center"><a data-noprint="1" href="Sommaire.dc.html" title="Retour au sommaire" style="display:flex;align-items:center;gap:6px;padding:7px 12px;background:#1d1c1a;color:#f3f0e8;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none" style-hover="background:#4a4740;color:#f3f0e8">← Sommaire</a><button onClick="{{ print }}" style="font:500 13px 'IBM Plex Sans',sans-serif;background:#1d1c1a;color:#f5f3ee;border:0;border-radius:999px;padding:10px 18px;cursor:pointer">Imprimer / PDF</button></div>
</div>
<sc-for list="{{ pages }}" as="pg" hint-placeholder-count="2">
  <section data-page="1" id="{{ pg.anchor }}" data-screen-label="{{ pg.label }}" style="width:210mm;height:297mm;box-sizing:border-box;padding:14mm 15mm;margin:16px auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <div style="display:flex;justify-content:space-between;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#4a4740;border-bottom:1.5px solid #1d1c1a;padding-bottom:6px">
      <span>{{ pg.kicker }}</span><span>{{ pg.kind }}</span>
    </div>
    <h1 style="font-family:Newsreader,serif;font-weight:400;font-size:30px;line-height:1.05;margin:4px 0 0;text-wrap:balance">{{ pg.title }}</h1>
    <sc-if value="{{ pg.hasIntro }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:12.5px;line-height:1.6;color:#2a2926;text-wrap:pretty;white-space:pre-line">{{ pg.intro }}</p></sc-if>
    <sc-if value="{{ pg.hasFields }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:8px 18px">
        <sc-for list="{{ pg.fields }}" as="f"><div style="flex:1 1 40mm;display:flex;gap:6px;align-items:flex-end;font-size:11px"><span style="font-weight:600">{{ f }}</span><span style="flex:1;border-bottom:1px solid #8a857a;height:14px"></span></div></sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.isFiche }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 20px">
        <sc-for list="{{ pg.blocks }}" as="b">
          <div style="display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid #d9d4c7">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.42 0.1 250)">{{ b.h }}</div>
            <sc-for list="{{ b.items }}" as="it"><div style="font-size:11px;line-height:1.45;text-wrap:pretty">{{ it }}</div></sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.isTable }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;border:1px solid #1d1c1a;flex:1;min-height:0">
        <div style="display:grid;grid-template-columns:{{ pg.cols }};background:#1d1c1a;color:#fff">
          <sc-for list="{{ pg.head }}" as="hd"><div style="padding:5px 6px;font-size:9.5px;font-weight:600;letter-spacing:.04em;border-right:1px solid #4a4740">{{ hd }}</div></sc-for>
        </div>
        <sc-for list="{{ pg.rows }}" as="r">
          <div style="display:grid;grid-template-columns:{{ pg.cols }};border-top:1px solid #b9b2a2;flex:1;min-height:{{ pg.rowH }}">
            <sc-for list="{{ r.cells }}" as="c"><div style="padding:5px 6px;font-size:10px;line-height:1.35;border-right:1px solid #d9d4c7;font-weight:{{ c.w }};color:#2a2926">{{ c.t }}</div></sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.hasNote }}" hint-placeholder-val="{{ false }}"><div style="font-size:10.5px;line-height:1.45;color:#4a4740;padding-top:6px;border-top:1px solid #d9d4c7">{{ pg.note }}</div></sc-if>
    <div style="margin-top:auto;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:#8a857a">Cliclac Studio · {{ pg.foot }}</div>
  </section>
</sc-for>
</x-dc>
<script type="text/x-dc" data-dc-script>
/*KIT*/
const KIT = {title:'Infographie et édition — B3 ESDAC', pages:[
 {kicker:'Infographie · Séance 1', kind:'Fiche récap', title:'Formats, marges, grilles', blocks:[
  {h:'ISO 216', items:['Rapport 1:√2, A0 = 1 m².','A1 594 × 841 · A2 420 × 594.','A3 297 × 420 · A4 210 × 297.']},
  {h:'Marges', items:['Petit fond, blanc de tête.','Grand fond, blanc de pied.','Canon 2:3:4:6 (Van de Graaf, Tschichold).']},
  {h:'Grille', items:['Colonne = (largeur utile − gouttières) ÷ n.','A4 paysage : 6 × 40 mm, gouttière 6, marges 13,5.']},
  {h:'Ligne de base', items:['Pas = interlignage du texte courant.']},
  {h:'Hiérarchie', items:['On regarde, on parcourt, on lit.','Point focal, lecture en Z ou en S.']},
  {h:'Nommage', items:['NOM_Prenom_S1_Gabarit.indd']}]},
 {kicker:'Infographie · Séance 2', kind:'Fiche récap', title:'Typographie et lisibilité', blocks:[
  {h:'Choisir', items:['Hauteur d’œil, contraste, chasse, graisses.','Deux familles au maximum.']},
  {h:'Texte courant', items:['9 à 11 pt, interlignage ~120 %.','Légendes 7 à 8 pt.']},
  {h:'Justification', items:['55 à 65 signes : lecture posée.','30 : hachée · 80–90 : fatigue.']},
  {h:'Texte justifié', items:['Intermots 75 à 125 %.','Sinon césure ou fer à gauche.']},
  {h:'Contraste', items:['4,5:1 minimum, 3:1 pour les grands corps.']},
  {h:'Espace', items:['Taille des lettres selon la distance.','Tester à l’échelle 1.']}]},
 {kicker:'Infographie · Séance 2', kind:'Texte fourni', title:'Texte imposé — exercice des justifications', intro:"Le projet transforme un ancien entrepôt de tissus en lieu de travail partagé pour des artisans. Le volume existant, long de quarante mètres, est conservé dans son intégralité : la charpente métallique, les briques et les grandes verrières d’origine restent visibles. À l’intérieur, une rue couverte distribue douze ateliers de tailles différentes, séparés par des cloisons en bois qui s’arrêtent sous la charpente pour laisser circuler la lumière. Au centre, une salle commune accueille les expositions et les rencontres avec le public. Les matériaux ajoutés sont peu nombreux : du bois de pays, de l’acier brut et un sol en béton poli. L’objectif est de montrer que l’on peut réhabiliter un bâtiment industriel sans en effacer l’histoire, en l’adaptant à de nouveaux usages.", note:"Consigne : composer ce texte trois fois, en 30, 60 et 90 signes par ligne, même corps et même caractère. Imprimer et comparer."},
 {kicker:'Infographie · Séance 3', kind:'Fiche récap', title:'Images et composition éditoriale', blocks:[
  {h:'Types d’images', items:['Plan, coupe, axonométrie.','Perspective, maquette, site, matière.']},
  {h:'Résolution', items:['300 ppi à la taille finale.','29,7 cm de large ≈ 3500 px.']},
  {h:'Plans', items:['Export PDF vectoriel.','Traits lisibles après réduction.']},
  {h:'Rapports', items:['Texte/image : domine, équilibre, domine.','Image/image : égalité, dominant, série.']},
  {h:'Légendes', items:['Quoi, où, échelle, crédit.','Style dédié, toujours au même endroit.']},
  {h:'Chemin de fer', items:['16 pages en vignettes.','Alterner denses et respirations.']}]},
 {kicker:'Infographie · Séance 4', kind:'Fiche récap', title:'Charte et planche de concours', blocks:[
  {h:'Charte', items:['Titre du projet, palette, typo.','Grille, pictogrammes, images.']},
  {h:'Palette', items:['2 à 3 couleurs + neutres.','CMJN et RVB.']},
  {h:'Planche A1', items:['594 × 841 mm portrait.','Grille modulaire, ex. 6 × 8.']},
  {h:'Trois niveaux', items:['De loin : titre, image.','À 1 m : plans, coupes.','De près : textes, légendes.']},
  {h:'Répartition', items:['Titre 10–15 %, image 35–40 %.','Technique 35 %, textes 10–15 %.']},
  {h:'Test', items:['Imprimer en A3, lire à 3 m.']}]},
 {kicker:'Infographie · Séance 5', kind:'Checklist', title:'Checklist de production', fields:['Nom','Projet'], cols:'1fr 20mm 20mm', head:['Vérification','Dossier','Planche'], rowH:'11mm', rows:[['Contrôle en amont sans erreur'],['Images 300 ppi effectifs'],['Images converties au profil CMJN'],['Texte noir en 100 % K'],['Fonds perdus 3 mm'],['Textes à 5 mm de la coupe'],['Polices incorporées'],['Nombre de pages multiple de 4 (piqûre à cheval)'],['PDF/X-4 impression'],['PDF écran allégé'],['Assemblage'],['Test d’impression à 100 %']]},
 {kicker:'Infographie · Séance 6', kind:'Évaluation', title:'Grille d’évaluation des soutenances', fields:["Nom"], cols:'1fr 13mm 13mm 13mm 13mm 13mm 48mm', head:['Critère','0','1','2','3','4','Commentaire'], rowH:'17mm', rows:[["Grille et marges tenues"],["Hiérarchie typographique"],["Qualité et choix des images"],["Rapport texte/image et rythme"],["Cohérence de la charte"],["Planche : lisibilité à distance"],["Fichiers de production"],["Argumentation"]], note:'Total ramené sur 20.'}
]};
/*END*/
class Component extends DCLogic {
  componentDidMount() { const h = location.hash.slice(1); if (h) setTimeout(() => { const el = document.getElementById(h); if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 16); }, 300); }
  renderVals() {
    const pages = KIT.pages.map((p, i) => {
      const n = p.head ? p.head.length : 0;
      return {
        anchor: 'p' + (i + 1), label: String(i + 1).padStart(2, '0') + ' ' + p.title, kicker: p.kicker, kind: p.kind, title: p.title,
        hasIntro: !!p.intro, intro: p.intro || '', hasFields: !!p.fields, fields: p.fields || [],
        isFiche: !!p.blocks, blocks: p.blocks || [],
        isTable: !!p.head, head: p.head || [], cols: p.cols || '1fr', rowH: p.rowH || '10mm',
        rows: (p.rows || []).map(r => ({ cells: Array.from({ length: n }, (_, j) => ({ t: r[j] || '', w: j === 0 ? 600 : 400 })) })),
        hasNote: !!p.note, note: p.note || '', foot: KIT.title
      };
    });
    return { pages, kitTitle: KIT.title, print: () => window.print() };
  }
}
</script>
</body>
</html>
