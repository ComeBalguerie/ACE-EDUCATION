<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e6df;color:#1d1c1a;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}a:hover{color:oklch(0.45 0.13 250)}
@page{size:A4;margin:0}
@media print{body{background:#fff}[data-noprint]{display:none !important}[data-page]{margin:0 !important;box-shadow:none !important;break-after:page}}
</style>
</helmet>
<div data-noprint="1" style="max-width:210mm;margin:0 auto;padding:32px 0 8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">
  <div style="display:flex;flex-direction:column;gap:2px">
    <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6b675e">Kit de séance · documents à imprimer</span>
    <span style="font-family:Newsreader,serif;font-size:26px">{{ kitTitle }}</span>
  </div>
  <div style="display:flex;gap:10px;align-items:center"><a data-noprint="1" href="Sommaire.dc.html" title="Retour au sommaire" style="display:flex;align-items:center;gap:6px;padding:7px 12px;background:#1d1c1a;color:#f3f0e8;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none" style-hover="background:#4a4740;color:#f3f0e8">← Sommaire</a><button onClick="{{ print }}" style="font:500 13px 'IBM Plex Sans',sans-serif;background:#1d1c1a;color:#f5f3ee;border:0;border-radius:999px;padding:10px 18px;cursor:pointer">Imprimer / PDF</button></div>
</div>
<sc-for list="{{ pages }}" as="pg" hint-placeholder-count="2">
  <section data-page="1" id="{{ pg.anchor }}" data-screen-label="{{ pg.label }}" style="width:210mm;height:297mm;box-sizing:border-box;padding:14mm 15mm;margin:16px auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:14px;overflow:hidden">
    <div style="display:flex;justify-content:space-between;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#4a4740;border-bottom:1.5px solid #1d1c1a;padding-bottom:6px">
      <span>{{ pg.kicker }}</span><span>{{ pg.kind }}</span>
    </div>
    <h1 style="font-family:Newsreader,serif;font-weight:400;font-size:30px;line-height:1.05;margin:4px 0 0;text-wrap:balance">{{ pg.title }}</h1>
    <sc-if value="{{ pg.hasIntro }}" hint-placeholder-val="{{ false }}"><p style="margin:0;font-size:12.5px;line-height:1.6;color:#2a2926;text-wrap:pretty;white-space:pre-line">{{ pg.intro }}</p></sc-if>
    <sc-if value="{{ pg.hasFields }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:8px 18px">
        <sc-for list="{{ pg.fields }}" as="f"><div style="flex:1 1 40mm;display:flex;gap:6px;align-items:flex-end;font-size:11px"><span style="font-weight:600">{{ f }}</span><span style="flex:1;border-bottom:1px solid #8a857a;height:14px"></span></div></sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.isFiche }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 20px">
        <sc-for list="{{ pg.blocks }}" as="b">
          <div style="display:flex;flex-direction:column;gap:4px;padding-top:6px;border-top:1px solid #d9d4c7">
            <div style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.42 0.1 250)">{{ b.h }}</div>
            <sc-for list="{{ b.items }}" as="it"><div style="font-size:11px;line-height:1.45;text-wrap:pretty">{{ it }}</div></sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.isTable }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;border:1px solid #1d1c1a;flex:1;min-height:0">
        <div style="display:grid;grid-template-columns:{{ pg.cols }};background:#1d1c1a;color:#fff">
          <sc-for list="{{ pg.head }}" as="hd"><div style="padding:5px 6px;font-size:9.5px;font-weight:600;letter-spacing:.04em;border-right:1px solid #4a4740">{{ hd }}</div></sc-for>
        </div>
        <sc-for list="{{ pg.rows }}" as="r">
          <div style="display:grid;grid-template-columns:{{ pg.cols }};border-top:1px solid #b9b2a2;flex:1;min-height:{{ pg.rowH }}">
            <sc-for list="{{ r.cells }}" as="c"><div style="padding:5px 6px;font-size:10px;line-height:1.35;border-right:1px solid #d9d4c7;font-weight:{{ c.w }};color:#2a2926">{{ c.t }}</div></sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ pg.hasNote }}" hint-placeholder-val="{{ false }}"><div style="font-size:10.5px;line-height:1.45;color:#4a4740;padding-top:6px;border-top:1px solid #d9d4c7">{{ pg.note }}</div></sc-if>
    <div style="margin-top:auto;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:#8a857a">Cliclac Studio · {{ pg.foot }}</div>
  </section>
</sc-for>
</x-dc>
<script type="text/x-dc" data-dc-script>
/*KIT*/
const KIT = {title:'Photoshop et initiation InDesign — B1 EIDM', pages:[
 {kicker:'Photoshop · Séance 1', kind:'Fiche récap', title:'Résolution, modes, formats', blocks:[
  {h:'Matriciel / vectoriel', items:['Matriciel : pixels, Photoshop.','Vectoriel : courbes, Illustrator.']},
  {h:'Résolution', items:['Pixels = cm × 300 ÷ 2,54.','A4 à 300 ppi : 2480 × 3508 px.','10 × 10 cm : 1181 × 1181 px.']},
  {h:'Formats écran', items:['Post : 1080 × 1350 px.','Story : 1080 × 1920 px.','Bannière web : selon le site.']},
  {h:'Modes', items:['RVB (sRVB) : écran.','CMJN : impression, profil de l’imprimeur.']},
  {h:'Fichiers', items:['PSD : travail, calques.','JPEG : photo, avec perte.','PNG : transparence.','TIFF : impression.','WebP : web.']},
  {h:'Réflexes', items:['Dupliquer l’arrière-plan (Cmd + J).','Nommer chaque calque.','Objets dynamiques pour redimensionner.','Taille de l’image ≠ Taille de la zone de travail.']}]},
 {kicker:'Photoshop · Séance 2', kind:'Fiche récap', title:'Cadrer et corriger', blocks:[
  {h:'Recadrage (C)', items:['Ratio imposé, règle des tiers.','Décocher « Supprimer les pixels recadrés ».','Option Redresser pour l’horizon.']},
  {h:'Verticales', items:['Recadrage perspective.','Filtre › Correction de l’objectif.']},
  {h:'Niveaux', items:['Curseurs noir, gris, blanc.','Lire l’histogramme.']},
  {h:'Courbes', items:['Courbe en S : plus de contraste.','Corrections par couche.']},
  {h:'Couleur', items:['Teinte/Saturation : une gamme.','Balance des couleurs : une dominante.','Noir et blanc : conversion contrôlée.']},
  {h:'Règle d’or', items:['Toujours en calque de réglage.','Masque pour limiter à une zone.','Jamais Image › Réglages.']}]},
 {kicker:'Photoshop · Séance 3', kind:'Fiche récap', title:'Quel outil pour quelle retouche', blocks:[
  {h:'Correcteur localisé', items:['Poussières, petits défauts.','Un clic.']},
  {h:'Correcteur', items:['Défauts sur texture.','Prélèvement avec Alt + clic.']},
  {h:'Pièce', items:['Grandes zones.','Entourer puis déplacer.']},
  {h:'Tampon', items:['Bords nets, motifs, textures répétées.','Copie exacte.']},
  {h:'Remplissage d’après le contenu', items:['Supprimer un objet et recréer le fond.']},
  {h:'Méthode', items:['Retoucher sur un calque vide.','« Échantillonner : tous les calques ».','Loi 2017 : mention « photographie retouchée » si la silhouette est modifiée.']}]},
 {kicker:'Photoshop · Séance 4', kind:'Fiche récap', title:'Sélectionner et détourer', blocks:[
  {h:'Automatiques', items:['Sélectionner le sujet.','Sélection d’objet.']},
  {h:'Manuels', items:['Sélection rapide : on peint.','Baguette : couleurs unies, tolérance.','Lasso polygonal : formes droites.','Plume : bords nets.']},
  {h:'Affiner', items:['Mode masque (Q).','Sélectionner et masquer : cheveux, fourrure.']},
  {h:'Raccourcis', items:['Maj : ajouter.','Alt : retrancher.','Cmd + D : désélectionner.','Cmd + Maj + I : intervertir.']},
  {h:'Toujours', items:['Détourer avec un masque de fusion.','Contrôler à 200 % sur fond vif.']},
  {h:'Jamais', items:['La gomme pour détourer.']}]},
 {kicker:'Photoshop · Séance 5', kind:'Fiche récap', title:'Couleur et composition', blocks:[
  {h:'Cercle', items:['Primaires, secondaires, complémentaires, analogues.']},
  {h:'Palette', items:['Dominante, secondaire, accent.','Contraste clair-obscur pour la lisibilité.']},
  {h:'Composition', items:['Un point focal.','Règle des tiers.','Lecture en Z.','Espace négatif pour le texte.']},
  {h:'Typographie', items:['Deux familles au maximum.','Didones fréquentes en mode.','Hiérarchie : titre, marque, informations.']},
  {h:'Montage crédible', items:['Même direction de lumière.','Couleur harmonisée (réglage écrêté).','Même netteté, même grain.','Ombre portée cohérente.']},
  {h:'Affiche', items:['40 × 60 cm, 300 ppi.','3 mm de fonds perdus.']}]},
 {kicker:'Photoshop · Séance 6', kind:'Fiche récap', title:'Anatomie d’une couverture', blocks:[
  {h:'Éléments', items:['Logo du titre.','Image de couverture.','Accroches principales et secondaires.','Date, numéro, prix, code-barres.']},
  {h:'Hiérarchie', items:['Trois niveaux typographiques au maximum.','Une accroche principale.']},
  {h:'Sujet devant le titre', items:['Dupliquer le sujet, masque, placer au-dessus du titre.']},
  {h:'Format', items:['230 × 300 mm, 300 ppi.','Fonds perdus 3 mm.','Marges de sécurité 10 mm.']},
  {h:'Cohérence', items:['Même palette et même typographie que l’affiche.']},
  {h:'À éviter', items:['Trop d’accroches.','Styles de calque appuyés.']}]},
 {kicker:'Photoshop · Séance 7', kind:'Fiche récap', title:'Premiers pas dans InDesign', blocks:[
  {h:'Photoshop', items:['Retoucher, détourer, monter une image.']},
  {h:'InDesign', items:['Mettre en page texte et images.','Plusieurs pages, grille, styles.']},
  {h:'Nouveau document', items:['Unités en millimètres.','Format, marges, colonnes.','Fonds perdus 3 mm.']},
  {h:'Blocs', items:['Tout est dans un bloc.','Cmd + D : importer une image.','Ajuster le contenu au bloc.']},
  {h:'Liens', items:['L’image est liée, pas intégrée.','Modifier le PSD met à jour la page.']},
  {h:'Raccourcis', items:['V sélection · A sélection directe.','T texte · F bloc rectangle.','W aperçu.']}]},
 {kicker:'Photoshop · Séance 8', kind:'Checklist', title:'Checklist de livraison', fields:['Nom','Support'], cols:'1fr 22mm 22mm', head:['Vérification','Imprimeur','Web'], rowH:'12mm', rows:[['Mode colorimétrique (CMJN profil imprimeur / sRVB)'],['Résolution 300 ppi à la taille finale'],['Dimensions en pixels correctes'],['Fonds perdus 3 mm (Taille de la zone de travail)'],['Textes à 5 mm minimum de la coupe'],['Noir du texte en 100 % K'],['Format de fichier (PDF, TIFF / JPEG, PNG, WebP)'],['Poids du fichier raisonnable'],['Nommage NOM_Prenom_Support'],['Fichier ouvert et vérifié après export']]},
 {kicker:'Photoshop · Séance 8', kind:'Évaluation', title:'Grille d’évaluation des présentations', fields:["Nom"], cols:'1fr 13mm 13mm 13mm 13mm 13mm 48mm', head:['Critère','0','1','2','3','4','Commentaire'], rowH:'17mm', rows:[["Direction artistique cohérente sur les trois supports"],["Qualité des retouches et détourages"],["Composition et hiérarchie"],["Typographie"],["Fichiers de sortie conformes"],["Clarté de la présentation"],["Choix techniques expliqués"]], note:'Total ramené sur 20.'}
]};
/*END*/
class Component extends DCLogic {
  componentDidMount() { const h = location.hash.slice(1); if (h) setTimeout(() => { const el = document.getElementById(h); if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 16); }, 300); }
  renderVals() {
    const pages = KIT.pages.map((p, i) => {
      const n = p.head ? p.head.length : 0;
      return {
        anchor: 'p' + (i + 1), label: String(i + 1).padStart(2, '0') + ' ' + p.title, kicker: p.kicker, kind: p.kind, title: p.title,
        hasIntro: !!p.intro, intro: p.intro || '', hasFields: !!p.fields, fields: p.fields || [],
        isFiche: !!p.blocks, blocks: p.blocks || [],
        isTable: !!p.head, head: p.head || [], cols: p.cols || '1fr', rowH: p.rowH || '10mm',
        rows: (p.rows || []).map(r => ({ cells: Array.from({ length: n }, (_, j) => ({ t: r[j] || '', w: j === 0 ? 600 : 400 })) })),
        hasNote: !!p.note, note: p.note || '', foot: KIT.title
      };
    });
    return { pages, kitTitle: KIT.title, print: () => window.print() };
  }
}
</script>
</body>
</html>
